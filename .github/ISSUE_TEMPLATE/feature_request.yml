name: Feature request
description: Suggest an idea or improvement for tokenmate
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the need or frustration behind the idea.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How you'd like it to work. Mock-ups of the terminal UI are welcome.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Board and gameplay
        - Player vs AI
        - AI vs AI
        - Models and providers
        - Evaluation (Stockfish / LLM review)
        - Lichess / Chess.com coaching
        - Docs or tooling
        - Other
    validations:
      required: true
  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I'd like to work on this myself
